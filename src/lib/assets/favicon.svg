<svg xmlns="http://www.w3.org/2000/svg" width="107" height="128" viewBox="0 0 107 128">
  <title>gold-star-emblem</title>
  <defs>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.45" stop-color="#F4C843"/>
      <stop offset="1" stop-color="#D69A12"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7951A"/>
      <stop offset="0.55" stop-color="#9C6E0B"/>
      <stop offset="1" stop-color="#6E4C05"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE08C"/>
      <stop offset="0.5" stop-color="#D9A422"/>
      <stop offset="1" stop-color="#8C6308"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#FF8FA8"/>
      <stop offset="0.4" stop-color="#E11D54"/>
      <stop offset="1" stop-color="#8A0930"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DCE2EA"/>
      <stop offset="1" stop-color="#A9B2BE"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#222831"/>
      <stop offset="1" stop-color="#13171C"/>
    </radialGradient>
  </defs>

  <!-- ===== centered square frame ===== -->
  <g fill="none" stroke="url(#goldFrame)" stroke-linejoin="round">
    <rect x="7.5" y="18" width="92" height="92" rx="3" stroke-width="3.4"/>
    <rect x="12.5" y="23" width="82" height="82" rx="2" stroke-width="1.6"/>
  </g>

  <!-- ===== gears (right side) ===== -->
  <g>
    <g transform="translate(82,52) scale(0.62)">
      <path d="M10,0 L6.93,2.87 L7.07,7.07 L2.87,6.93 L0,10 L-2.87,6.93 L-7.07,7.07 L-6.93,2.87 L-10,0 L-6.93,-2.87 L-7.07,-7.07 L-2.87,-6.93 L0,-10 L2.87,-6.93 L7.07,-7.07 L6.93,-2.87 Z" fill="url(#goldDark)"/>
      <circle r="4.2" fill="url(#goldFrame)"/>
      <circle r="1.7" fill="#4A3306"/>
    </g>
    <g transform="translate(76,90) scale(0.82)">
      <path d="M10,0 L6.93,2.87 L7.07,7.07 L2.87,6.93 L0,10 L-2.87,6.93 L-7.07,7.07 L-6.93,2.87 L-10,0 L-6.93,-2.87 L-7.07,-7.07 L-2.87,-6.93 L0,-10 L2.87,-6.93 L7.07,-7.07 L6.93,-2.87 Z" fill="url(#goldDark)"/>
      <circle r="4.2" fill="url(#goldFrame)"/>
      <circle r="1.7" fill="#4A3306"/>
    </g>
    <g transform="translate(64,40) scale(0.4)">
      <path d="M10,0 L6.93,2.87 L7.07,7.07 L2.87,6.93 L0,10 L-2.87,6.93 L-7.07,7.07 L-6.93,2.87 L-10,0 L-6.93,-2.87 L-7.07,-7.07 L-2.87,-6.93 L0,-10 L2.87,-6.93 L7.07,-7.07 L6.93,-2.87 Z" fill="url(#goldFrame)"/>
      <circle r="3.6" fill="#4A3306"/>
    </g>
  </g>

  <!-- ===== small diamond stars (left side) ===== -->
  <g>
    <g transform="translate(30,40) rotate(-6)">
      <path d="M0,-12 L3.2,-3.2 L10,0 L3.2,3.2 L0,12 L-3.2,3.2 L-10,0 L-3.2,-3.2 Z" fill="url(#silver)" stroke="#9C6E0B" stroke-width="0.7" stroke-linejoin="round"/>
      <circle r="2.4" fill="url(#ruby)"/>
    </g>
    <g transform="translate(31,92) rotate(8)">
      <path d="M0,-12 L3.2,-3.2 L10,0 L3.2,3.2 L0,12 L-3.2,3.2 L-10,0 L-3.2,-3.2 Z" fill="url(#silver)" stroke="#9C6E0B" stroke-width="0.7" stroke-linejoin="round"/>
      <circle r="2.4" fill="url(#ruby)"/>
    </g>
  </g>

  <!-- scattered rubies -->
  <g fill="url(#ruby)">
    <circle cx="70" cy="37" r="2.1"/>
    <circle cx="89" cy="55" r="2.1"/>
    <circle cx="84" cy="73" r="2"/>
    <circle cx="61" cy="101" r="2"/>
  </g>

  <!-- ===== central 4-point star (faceted) ===== -->
  <!-- light facets -->
  <g fill="url(#goldLight)">
    <path d="M53.5,18 L43.5,54 L53.5,64 Z"/>
    <path d="M93.5,64 L63.5,54 L53.5,64 Z"/>
    <path d="M53.5,110 L63.5,74 L53.5,64 Z"/>
    <path d="M13.5,64 L43.5,74 L53.5,64 Z"/>
  </g>
  <!-- dark facets -->
  <g fill="url(#goldDark)">
    <path d="M53.5,18 L63.5,54 L53.5,64 Z"/>
    <path d="M93.5,64 L63.5,74 L53.5,64 Z"/>
    <path d="M53.5,110 L43.5,74 L53.5,64 Z"/>
    <path d="M13.5,64 L43.5,54 L53.5,64 Z"/>
  </g>
  <!-- crisp outline -->
  <path d="M53.5,18 L63.5,54 L93.5,64 L63.5,74 L53.5,110 L43.5,74 L13.5,64 L43.5,54 Z"
        fill="none" stroke="#6E4C05" stroke-width="1" stroke-linejoin="round"/>

  <!-- ===== ruby cross at the heart ===== -->
  <g fill="url(#ruby)">
    <circle cx="53.5" cy="49" r="2.3"/>
    <circle cx="53.5" cy="56" r="3"/>
    <circle cx="53.5" cy="64" r="3.6"/>
    <circle cx="53.5" cy="72" r="3"/>
    <circle cx="53.5" cy="79" r="2.3"/>
    <circle cx="45" cy="64" r="2.7"/>
    <circle cx="62" cy="64" r="2.7"/>
  </g>
</svg>
