name: sync-public-mirror
on:
  push: { branches: [main, 0.0.2] }
  workflow_dispatch:
concurrency: { group: mirror-sync, cancel-in-progress: true }
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # filter-repo needs full history
          persist-credentials: false # else the injected token extraheader overrides push auth
      - run: pip install git-filter-repo==2.47.0   # pinned: rewrite verified on this version
      - run: git filter-repo --force --invert-paths --paths-from-file .github/mirror-exclusions.txt
      - name: secret scan (blocking — never delete this step)
        run: docker run --rm -v "$PWD:/r" ghcr.io/gitleaks/gitleaks:latest detect --source /r
        # if the image's CLI has drifted, fix flags per --help; the gate itself is non-negotiable
      - run: |
          git remote add mirror "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/Foobasaur/fantaseer-public.git"
          git push --force mirror main 0.0.2
